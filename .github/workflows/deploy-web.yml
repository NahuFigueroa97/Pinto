# Publica la web en GitHub Pages.
#
# Para qué sirve: cuando alguien comparte un plan por WhatsApp, el que lo
# recibe y no tiene la app instalada tiene que caer en ALGÚN lado. Sin esto,
# el link no lleva a ninguna parte.
#
# Es la misma app: `output: 'export'` genera un sitio estático completo, así
# que la web y la APK salen del mismo código.

name: Publicar web

on:
  push:
    branches: [main]
  workflow_dispatch:        # botón para publicar a mano desde la pestaña Actions

# Permisos mínimos para que la acción de Pages pueda publicar.
permissions:
  contents: read
  pages: write
  id-token: write

# Si se pushea dos veces seguidas, que gane la última en vez de pisarse.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22          # el package.json exige >=22 (Capacitor CLI)
          cache: npm

      - run: npm ci

      # El chequeo de next.config.mjs esta pensado para cuando alguien compila
      # en su maquina: dice "crea un .env.local". Aca eso no sirve de nada y
      # manda a buscar el problema al lugar equivocado. Este paso corta antes
      # con el mensaje que corresponde.
      - name: Verificar que esten los secrets
        env:
          URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          faltan=""
          [ -z "$URL" ] && faltan="$faltan NEXT_PUBLIC_SUPABASE_URL"
          [ -z "$KEY" ] && faltan="$faltan NEXT_PUBLIC_SUPABASE_ANON_KEY"

          if [ -n "$faltan" ]; then
            echo "::error::Faltan secrets del repositorio:$faltan"
            cat <<'AYUDA'

          ┌──────────────────────────────────────────────────────────────┐
          │  Faltan los secrets del repositorio                          │
          └──────────────────────────────────────────────────────────────┘

          Esto NO se arregla con un .env.local: en GitHub los valores salen
          de los secrets del repo.

            Settings > Secrets and variables > Actions > New repository secret

          Crea estos dos, con el nombre EXACTO:

            NEXT_PUBLIC_SUPABASE_URL       https://<tu-ref>.supabase.co
            NEXT_PUBLIC_SUPABASE_ANON_KEY  sb_publishable_...  (o la anon)

          Los dos valores estan en:
            Supabase Dashboard > Project Settings > API Keys

          OJO: va la clave publishable / anon, la que ya viaja adentro del
          APK. La service_role / sb_secret_ NUNCA: saltea todos los permisos
          de la base y quedaria publicada.

          Despues de crearlos, volve a esta pagina del Action y toca
          "Re-run all jobs" (arriba a la derecha). No hace falta pushear
          de nuevo.

          AYUDA
            exit 1
          fi

          echo "Secrets presentes."

      - name: Compilar el sitio
        env:
          # La anon key es pública por diseño: viaja adentro del APK igual.
          # Va como secret sólo por prolijidad, no porque sea sensible.
          # NUNCA poner acá la service_role / sb_secret_: esa saltea RLS.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # Un repo de proyecto se sirve bajo /<repo>/.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: npm run build

      - name: Preparar la salida
        run: |
          # Sin .nojekyll, GitHub pasa el sitio por Jekyll, que ignora todo lo
          # que empieza con guion bajo. Next pone TODO el JS y el CSS en
          # _next/, así que la página cargaría en blanco.
          touch out/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
