apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

// Versión de la app, desde android/gradle.properties (ver ese archivo).
//
// Se resuelve acá y no inline dentro de defaultConfig porque en Groovy
//     versionCode (expr).toString().toInteger()
// se parsea como la llamada al método versionCode(expr) y después aplica
// .toString() al valor que devuelve ese setter, que es null:
//     "A problem occurred evaluating project ':app'. > Value is null"
def pintoVersionCodeValue = Integer.parseInt(
    (project.findProperty('pintoVersionCode') ?: '1').toString().trim())
def pintoVersionNameValue = (project.findProperty('pintoVersionName') ?: '1.0').toString().trim()
// Host de los App Links. Vacio = sin dominio configurado todavia; se usa un
// placeholder que no resuelve para que el intent-filter no capture nada.
def pintoAppLinkHostValue = (project.findProperty('pintoAppLinkHost') ?: '').toString().trim()
if (pintoAppLinkHostValue.isEmpty()) {
    pintoAppLinkHostValue = 'app-link-sin-configurar.invalid'
}

android {
    namespace "com.pinto.social"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.pinto.social"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Definidos arriba desde android/gradle.properties.
        versionCode pintoVersionCodeValue
        versionName pintoVersionNameValue
        manifestPlaceholders = [appLinkHost: pintoAppLinkHostValue]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        // Antes esto se declaraba siempre y, sin keystore.properties, apuntaba
        // a storeFile '/dev/null': el build de release fallaba con un error
        // críptico de keystore en vez de decir que falta el archivo.
        if (hasReleaseKeystore) {
            release {
                storeFile file(keystoreProperties['RELEASE_STORE_FILE'])
                storePassword keystoreProperties['RELEASE_STORE_PASSWORD']
                keyAlias keystoreProperties['RELEASE_KEY_ALIAS']
                keyPassword keystoreProperties['RELEASE_KEY_PASSWORD']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"

    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

apply from: 'capacitor.build.gradle'

def servicesJSON = file('google-services.json')
if (servicesJSON.exists() && servicesJSON.length() > 0) {
    apply plugin: 'com.google.gms.google-services'
} else {
    // Antes esto estaba dentro de un try/catch que se tragaba el error en
    // silencio: si faltaba google-services.json el APK compilaba igual y el
    // push simplemente no funcionaba, sin ninguna pista de por qué.
    throw new GradleException(
        "Falta android/app/google-services.json. Descargalo de Firebase Console " +
        "(Configuracion del proyecto > Tus apps > Android) o el push no va a funcionar.")
}
